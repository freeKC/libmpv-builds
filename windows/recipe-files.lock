# The two files of the Windows build recipe that set the options of FFmpeg and mpv (media_kit's video configuration,
# without the TLS patch, see the header of each file), downloaded by fetch_recipe_files.py and checked by their SHA-256
# before they are copied over packages/ of the recipe.
#
# They are modified copies of packages/ffmpeg.cmake and packages/mpv.cmake of shinchiro/mpv-winbuild-cmake (through
# Predidit/libmpv-win32-video-cmake), a repository without a license file. Until its author says under which license
# they may be reused (https://github.com/shinchiro/mpv-winbuild-cmake/issues/855), this repository does not copy them:
# it takes them from the commit of freeKC/Immuch360 where they were written, as that repository already publishes them.
# The source archive of each release still holds them, with the rest of the recipe, as the LGPL asks for the scripts
# used to build the library.
#
# file  url  sha256
